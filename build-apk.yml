name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flet CLI kur
        run: pip install flet

      - name: APK derle
        run: flet build apk --verbose

      - name: APK'yi yukle (indirilebilir dosya olarak)
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-ide-apk
          path: build/apk/*.apk
